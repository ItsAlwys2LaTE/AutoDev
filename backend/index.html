<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoDev — Autonomous Software Engineering Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Prevent Flash of Unstyled Theme (FOUT)
      (function() {
        try {
          const stored = localStorage.getItem('autodev_dark_mode');
          if (stored === '0') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen bg-slate-50 dark:bg-[#0a0e1a] text-slate-800 dark:text-slate-100 antialiased font-sans selection:bg-indigo-500/30 selection:text-indigo-200">
    <div id="root"></div>
  </body>
</html>
